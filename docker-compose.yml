# Local development database only. Reads POSTGRES_* from your .env file.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1 = reachable only from this computer, not from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pos_db_data:/var/lib/postgresql/data
  web:
    build: . 
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PIN_SECRET: ${PIN_SECRET:?Set PIN_SECRET in .env}
    depends_on:
      - db
volumes:
  pos_db_data:
  